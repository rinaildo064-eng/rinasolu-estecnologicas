<style>
/* Tema escuro único (preto com dourado, a partir da logo). Layout: cabeçalho institucional + abas; painel em grade de cartões; tabelas densas; documento de OF em "papel" branco */
:root{
  --bg:#0b0c0d; --surface:#141619; --surface-2:#1a1d21; --ink:#ede9df; --muted:#a39e91;
  --line:#2a2d32; --line-strong:#3d4248;
  --accent:#d6ae4b; --accent-ink:#17120a; --accent-soft:#2a2312;
  --bar:#c9a13b; --bar-track:#272a2f;
  --ok:#5fcf90; --ok-soft:#12301f;
  --warn:#f0b04a; --warn-soft:#3a2c12;
  --bad:#ff8a80; --bad-soft:#3d1d1b;
  --info:#8fb6e6; --info-soft:#1c2d42;
  --neutral:#aab2ad; --neutral-soft:#262a2d;
  --paper:#ffffff; --paper-ink:#111815; --paper-line:#c9d2cd;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.55);
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-head:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:radial-gradient(1200px 500px at 50% -10%,#1b1810 0%,var(--bg) 60%) no-repeat,var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
h1,h2,h3{font-family:var(--f-head);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.005em}
h2{font-size:17px}
h3{font-size:15px}
.mono{font-family:var(--f-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}

/* topo */
.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:14px}
.refbox{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.refbox label{font-size:12px;color:var(--muted)}
.sim{background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:2px 7px;font-size:11.5px;font-weight:600}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line-strong);margin-bottom:20px}
.tab{display:inline-flex;align-items:center;appearance:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:500 14px var(--f-body);padding:10px 14px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.badge{display:inline-block;min-width:20px;text-align:center;margin-left:6px;padding:0 6px;border-radius:10px;font-size:11.5px;background:var(--neutral-soft);color:var(--neutral)}
.badge.hot{background:var(--bad-soft);color:var(--bad)}


.brand{display:flex;align-items:center;gap:16px;min-width:0}
.brand .logo{height:72px;width:auto;flex:none;display:block}
.brand .eyebrow{color:var(--accent);margin-bottom:3px}
.brand h1{font-size:25px;line-height:1.15}
.brandfoot{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:40px;padding-top:22px;border-top:1px solid var(--line);text-align:center}
.brandfoot img{height:84px;width:auto;max-width:100%}
.paper .plogo{height:58px;width:auto;display:block;margin:0 auto 6px;filter:brightness(.82) saturate(1.25)}
@media (max-width:560px){.brand .logo{height:54px}.brand h1{font-size:21px}}


html{-webkit-text-size-adjust:100%}
@media (max-width:640px){
  .rt thead{display:none}
  .rt,.rt tbody,.rt tr,.rt td{display:block;width:100%}
  .rt tbody tr{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;padding:8px 12px;background:var(--surface-2)}
  .rt td{border:0;padding:5px 0;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 12px;text-align:right;min-width:0}
  .rt td::before{content:attr(data-label);color:var(--muted);font-size:12px;text-align:left;flex:none}
  .rt td.first{display:block;text-align:left;font-weight:500;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:4px}
  .rt td.first::before{display:none}
  .rt td .rowmsg{flex-basis:100%;text-align:right}
  .rt td[style*="min-width"]{min-width:0!important}
  .rt tfoot,.rt tfoot tr{display:flex;justify-content:space-between;gap:12px;padding:6px 12px}
  .rt tfoot td{display:block;width:auto;border:0}
  .rt tfoot td::before{display:none}
  .rt tbody tr:has(td.empty) td::before{display:none}
  .refbox{width:100%}
  .top{align-items:stretch}
  .modal{padding:14px}
  .toolbar .split{width:100%}
  .toolbar .split .in{width:100%!important;flex:1 1 140px}
  .mft .btn{flex:1 1 auto;justify-content:center}
  .tile .v{font-size:28px}
}


.rightbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.userbox{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.login{min-height:calc(100vh - 60px);display:grid;place-items:center;padding-block:12px}
.logincard{width:min(420px,100%);display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:10px;padding:26px 24px;box-shadow:var(--shadow)}
.loginlogo{display:block;height:110px;width:auto;max-width:100%;margin:0 auto 4px}
.passrow{display:flex;gap:8px;align-items:center}
@media (max-width:640px){.rightbar{width:100%}.rightbar .refbox{flex:1 1 100%}.userbox{width:100%;justify-content:space-between}.userbox b{margin-right:auto}}


.btn.ghost.dng{color:var(--bad)}
td.acts .btn{margin:2px 4px 2px 0}
@media (max-width:640px){.rt td.acts{justify-content:flex-start}.rt td.acts::before{display:none}}

[hidden]{display:none!important}
.busybar{position:fixed;left:0;right:0;top:0;height:3px;z-index:100;background:linear-gradient(90deg,transparent,var(--accent),transparent) no-repeat;background-size:40% 100%;animation:busy 1s linear infinite}
@keyframes busy{from{background-position:-40% 0}to{background-position:140% 0}}
.spin{width:34px;height:34px;border:3px solid var(--line-strong);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.bootbox{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.bootbox img{height:96px;width:auto;max-width:100%}
.linkbtn{appearance:none;background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;font-size:12.5px;text-align:center;padding:2px;text-decoration:underline}
.cfgbox{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.userbox .ub{display:flex;flex-direction:column;line-height:1.25;min-width:0}
@media (prefers-reduced-motion:reduce){.busybar,.spin{animation:none}}

/* controles */
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{appearance:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:5px;padding:7px 12px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label{font-size:12px;font-weight:500;color:var(--muted)}
.in{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:5px;padding:7px 9px;min-width:0}
.in:disabled{background:var(--surface-2);color:var(--muted)}
textarea.in{resize:vertical;min-height:64px}
.in.err{border-color:var(--bad);background:var(--bad-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:5px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--surface);padding:4px 11px;font-size:12.5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* cartões */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.card>.hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.tile .v{font-family:var(--f-head);font-size:32px;font-weight:600;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.tile.t-bad .v{color:var(--bad)} .tile.t-warn .v{color:var(--warn)} .tile.t-ok .v{color:var(--ok)}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.tiles{grid-template-columns:minmax(0,1fr)}}

/* pílulas */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:4px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.neutral{background:var(--neutral-soft);color:var(--neutral)}

/* tabelas */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tr.off td{color:var(--muted)}
tfoot td{font-weight:600;border-top:1px solid var(--line-strong);border-bottom:0}

/* barras */
.bar{height:8px;background:var(--bar-track);border-radius:4px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--bar);border-radius:0 4px 4px 0}
.bar.hot i{background:var(--warn)}
.brow{display:grid;grid-template-columns:minmax(110px,1.1fr) minmax(0,2fr) 112px;gap:12px;align-items:center;padding:6px 0}
.brow .lbl{min-width:0;overflow-wrap:anywhere}
.brow .val{font-variant-numeric:tabular-nums;font-weight:500;text-align:right;white-space:nowrap}
@media (max-width:520px){.brow{grid-template-columns:minmax(0,1fr) auto}.brow .bar{grid-column:1/-1;order:3}}
.stack{display:flex;gap:2px;height:22px}
.stack>div{border-radius:3px;min-width:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px}
.legend b{font-variant-numeric:tabular-nums}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.sw.ok{background:var(--ok)}.sw.warn{background:var(--warn)}.sw.bad{background:var(--bad)}.sw.info{background:var(--info)}.sw.neutral{background:var(--neutral)}

/* alertas */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2)}
.alert.bad{border-left:4px solid var(--bad)}
.alert.warn{border-left:4px solid var(--warn)}
.alert.neutral{border-left:4px solid var(--neutral)}
.alert .t{min-width:0}
.alert .t b{font-weight:600}
@media (max-width:560px){.alert{grid-template-columns:minmax(0,1fr) auto}.alert .pill{grid-column:1/-1;justify-self:start}}
.note{border-radius:6px;padding:10px 12px;font-size:13px}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.info{background:var(--info-soft);color:var(--info)}
.note ul{margin:6px 0 0;padding-left:18px}

/* formulários */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.fgrid .span2{grid-column:1/-1}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;margin-bottom:12px}
.toolbar .grow{flex:1 1 200px;min-width:0}
.qty{width:110px;text-align:right}
.rowmsg{font-size:12px;color:var(--bad);margin-top:3px;min-height:0}
.rowmsg.ok{color:var(--muted)}

/* modal */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,14,12,.55);overflow-y:auto;display:flex;justify-content:center;align-items:flex-start;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);width:100%;max-width:880px;margin:auto;padding:20px;min-width:0}
.modal.wide{max-width:980px}
.mhd{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
.mft{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 16px;margin-bottom:14px}
.kv div{min-width:0;overflow-wrap:anywhere}
.kv dt,.kv .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

/* documento impresso */
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:3px;padding:28px 30px;font-size:13px;position:relative}
.paper h2,.paper h3{color:var(--paper-ink)}
.paper .ph{text-align:center;border-bottom:2px solid var(--paper-ink);padding-bottom:10px;margin-bottom:14px}
.paper .ph .org{font-family:var(--f-head);font-size:16px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.paper .ph .sec{font-size:13px}
.paper .doc-title{font-family:var(--f-head);font-size:20px;text-align:center;margin:6px 0 14px;letter-spacing:.06em}
.paper table th{color:#44504a;border-bottom:1px solid var(--paper-ink)}
.paper table td{border-bottom:1px solid var(--paper-line)}
.paper .meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 20px;margin-bottom:14px}
.paper .meta div{min-width:0;overflow-wrap:anywhere}
.paper .meta .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#5a665f}
.paper .sign{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:46px;text-align:center;font-size:12px}
.paper .sign div{border-top:1px solid var(--paper-ink);padding-top:5px}
.paper .stamp{position:absolute;top:70px;right:24px;border:3px solid #b3261e;color:#b3261e;font-weight:700;letter-spacing:.12em;padding:2px 12px;transform:rotate(8deg);font-size:18px}
.paper .foot{margin-top:18px;font-size:11px;color:#5a665f}
.paper .sect{margin-top:20px}
.paper .sect h3{border-bottom:1px solid var(--paper-line);padding-bottom:4px;margin-bottom:8px}
@media (max-width:560px){.paper{padding:18px 14px}.paper .meta{grid-template-columns:minmax(0,1fr)}.paper .sign{grid-template-columns:minmax(0,1fr)}}

/* tooltip e aviso */
#tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:5px;font-size:12.5px;max-width:260px;box-shadow:var(--shadow);display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.stack-v{display:flex;flex-direction:column;gap:12px}
.split{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
textarea.copybox{width:100%;min-height:240px;font-family:var(--f-mono);font-size:12px}
@media (prefers-reduced-motion:no-preference){.bar i,.stack>div{transition:width .25s ease}}

@media print{
  body{background:#fff}
  .no-print,.tabs,.top,#tip,.toast{display:none!important}
  main.under-modal{display:none!important}
  .wrap{padding:0;max-width:none}
  .overlay{position:static!important;background:none!important;padding:0!important;display:block!important;overflow:visible!important}
  .modal{box-shadow:none!important;padding:0!important;max-width:none!important;background:none!important}
  .paper{border:0;padding:0}
  .card{border:0;padding:0}
}

/* ---------- carga dos dados ---------- */
async function fetchAll(table,orderCol){
  var out=[],from=0,size=1000;
  for(;;){
    var r=await sb.from(table).select('*').order(orderCol,{ascending:true}).range(from,from+size-1);
    if(r.error)throw r.error;
    var rows=r.data||[];
    out=out.concat(rows);
    if(rows.length<size)break;
    from+=size;
  }
  return out;
}
async function loadAll(){
  var r=await Promise.all([
    fetchAll('secretarias','nome'),fetchAll('contratos','numero'),fetchAll('itens_contrato','id'),
    fetchAll('ordens_fornecimento','numero'),fetchAll('itens_of','id'),
    fetchAll('v_saldo_itens','item_id'),fetchAll('v_contratos_resumo','numero')]);
  var secs=r[0],cs=r[1],its=r[2],os=r[3],lns=r[4],saldos=r[5],resumo=r[6];
  var secName={};secs.forEach(function(x){secName[x.id]=x.nome});
  var consumed={};saldos.forEach(function(x){consumed[x.item_id]=Number(x.quantidade_consumida)||0});
  var usedVal={};resumo.forEach(function(x){usedVal[x.id]=Number(x.valor_consumido)||0});
  var itemsBy={};its.forEach(function(i){(itemsBy[i.contrato_id]=itemsBy[i.contrato_id]||[]).push({id:i.id,desc:i.descricao,un:i.unidade,qty:Number(i.quantidade_licitada),price:Number(i.valor_unitario),consumed:consumed[i.id]||0})});
  var linesBy={};lns.forEach(function(l){(linesBy[l.of_id]=linesBy[l.of_id]||[]).push({id:l.id,itemId:l.item_contrato_id,desc:l.descricao,un:l.unidade,qty:Number(l.quantidade),price:Number(l.valor_unitario)})});
  var byDesc=function(a,b){return a.desc.localeCompare(b.desc,'pt-BR')};
  secretarias=secs.filter(function(x){return x.ativo}).map(function(x){return {id:x.id,nome:x.nome}});
  SECS=secretarias.map(function(x){return x.nome});
  contracts=cs.map(function(c){return {id:c.id,num:c.numero,forn:c.fornecedor,cnpj:c.cnpj||'',obj:c.objeto,start:c.data_inicio,end:c.data_fim,used:usedVal[c.id]||0,items:(itemsBy[c.id]||[]).sort(byDesc)}});
  ofs=os.map(function(o){return {id:o.id,num:o.numero,contractId:o.contrato_id,secId:o.secretaria_id,sec:secName[o.secretaria_id]||'—',sub:o.subdivisao||'',date:o.data_emissao,solicitante:o.solicitante,just:o.justificativa||'',status:o.status==='emitida'?'Emitida':'Cancelada',lines:(linesBy[o.id]||[]).sort(byDesc)}});
  realToday=todayBR();S.ref=realToday;
}

/* ---------- regras de negócio ---------- */
function getC(id){return contracts.filter(function(c){return c.id===id})[0]}
function contractStatus(c,ref){
  if(ref<c.start)return {key:'futuro',label:'Aguardando início',cls:'info',days:diffDays(ref,c.start)};
  if(ref>c.end)return {key:'vencido',label:'Encerrado',cls:'neutral',days:diffDays(c.end,ref)};
  var d=diffDays(ref,c.end);
  var lbl=d===0?'Vence hoje':d===1?'Vence amanhã':'Vence em '+d+' dias';
  if(d<=30)return {key:'v30',label:lbl,cls:'bad',days:d};
  if(d<=60)return {key:'v60',label:lbl,cls:'warn',days:d};
  return {key:'vigente',label:'Vigente',cls:'ok',days:d};
}
function isBlocked(st){return st.key==='vencido'||st.key==='futuro'}
function blockReason(c,st){
  if(st.key==='vencido')return 'Contrato encerrado em '+fmtDate(c.end)+'. Novas OFs estão bloqueadas.';
  if(st.key==='futuro')return 'A vigência deste contrato começa em '+fmtDate(c.start)+'. Novas OFs estão bloqueadas até lá.';
  return '';
}
function isActiveOF(o){return o.status==='Emitida'}
function usedQty(c,itemId,ex){var it=c.items.filter(function(x){return x.id===itemId})[0];var t=it?it.consumed:0;if(ex){var o=ofs.filter(function(x){return x.id===ex})[0];if(o&&isActiveOF(o))o.lines.forEach(function(l){if(l.itemId===itemId)t-=l.qty})}return t}
function role(){return S.profile?S.profile.perfil:''}
function isAdm(){return role()==='admin'}
function canCreateOF(){return role()==='admin'||role()==='secretaria'}
function canManageOF(secId){return role()==='admin'||(role()==='secretaria'&&!!S.profile&&secId===S.profile.secretaria_id)}
function ownSecName(){var s=secretarias.filter(function(x){return S.profile&&x.id===S.profile.secretaria_id})[0];return s?s.nome:''}
function roleLabel(){return {admin:'Administrador',secretaria:'Secretaria',consulta:'Consulta'}[role()]||''}
function blankForm(){var p=(typeof S!=='undefined'&&S&&S.profile&&S.profile.perfil==='secretaria');return {editId:null,sec:p?ownSecName():'',sub:'',contractId:'',solicitante:'',just:'',qty:{}}}
function saldoQty(c,it,ex){return it.qty-usedQty(c,it.id,ex)}
function contractTotal(c){return c.items.reduce(function(s,i){return s+i.qty*i.price},0)}
function contractUsed(c){return c.used||0}
function ofTotal(o){return o.lines.reduce(function(s,l){return s+l.qty*l.price},0)}

function validateOF(f){
  var errs=[],ed=f.editId?ofs.filter(function(o){return o.id===f.editId})[0]:null;
  var c=getC(f.contractId);
  if(role()==='secretaria')f.sec=ownSecName();
  var sec=secretarias.filter(function(x){return x.nome===f.sec})[0];
  if(!sec)errs.push('Escolha a secretaria solicitante.');
  if(!c){errs.push('Escolha o contrato.');return {errs:errs}}
  var st=contractStatus(c,S.ref),blocked=isBlocked(st);
  if(blocked&&!ed)errs.push(blockReason(c,st));
  if(!String(f.solicitante||'').trim())errs.push('Informe o nome do responsável pela solicitação.');
  var lines=[];
  c.items.forEach(function(it){
    var raw=String(f.qty[it.id]==null?'':f.qty[it.id]).trim();
    if(raw==='')return;
    if(!/^\d+$/.test(raw)){errs.push('"'+it.desc+'": informe um número inteiro.');return}
    var q=parseInt(raw,10);
    if(q===0)return;
    var s=saldoQty(c,it,ed?ed.id:null);
    var old=ed?ed.lines.filter(function(x){return x.itemId===it.id})[0]:null;
    if(q>s&&!(blocked&&old&&old.qty===q)){errs.push('"'+it.desc+'": solicitado '+NUM.format(q)+', saldo disponível '+NUM.format(s)+' '+it.un+'.');return}
    lines.push({itemId:it.id,desc:old?old.desc:it.desc,un:old?old.un:it.un,qty:q,price:old?old.price:it.price});
  });
  if(!errs.length&&!lines.length)errs.push('Informe a quantidade de pelo menos um item.');
  if(!errs.length&&ed&&blocked){
    var same=lines.length===ed.lines.length&&lines.every(function(l){return ed.lines.some(function(x){return x.itemId===l.itemId&&x.qty===l.qty})});
    if(!same)errs.push('Contrato fora de vigência: só é possível alterar os dados do cabeçalho, não as quantidades.');
  }
  if(errs.length)return {errs:errs};
  return {ok:true,c:c,ed:ed,lines:lines,secId:sec.id};
}

/* ---------- métricas ---------- */
function metrics(){
  var ref=S.ref;
  var rows=contracts.map(function(c){return {c:c,st:contractStatus(c,ref),tot:contractTotal(c),used:contractUsed(c)}});
  var cnt={vigente:0,v60:0,v30:0,vencido:0,futuro:0};
  rows.forEach(function(r){cnt[r.st.key]++});
  var activeRows=rows.filter(function(r){return r.st.key==='vigente'||r.st.key==='v60'||r.st.key==='v30'});
  var tot=activeRows.reduce(function(s,r){return s+r.tot},0);
  var used=activeRows.reduce(function(s,r){return s+r.used},0);
  var bySec={};SECS.forEach(function(s){bySec[s]={sec:s,n:0,val:0}});
  var items={};
  ofs.forEach(function(o){
    if(!isActiveOF(o))return;
    if(!bySec[o.sec])bySec[o.sec]={sec:o.sec,n:0,val:0};
    bySec[o.sec].n++;bySec[o.sec].val+=ofTotal(o);
    o.lines.forEach(function(l){
      var k=l.desc+'|'+l.un;
      if(!items[k])items[k]={desc:l.desc,un:l.un,qty:0,val:0,n:0};
      items[k].qty+=l.qty;items[k].val+=l.qty*l.price;items[k].n++;
    });
  });
  var secArr=Object.keys(bySec).map(function(k){return bySec[k]}).sort(function(a,b){return b.val-a.val});
  var itemArr=Object.keys(items).map(function(k){return items[k]});
  var totalOF=secArr.reduce(function(s,x){return s+x.val},0);
  var low=[];
  rows.forEach(function(r){
    if(isBlocked(r.st))return;
    r.c.items.forEach(function(it){var s=saldoQty(r.c,it);var p=pctOf(s,it.qty);if(p<=10)low.push({c:r.c,it:it,saldo:s,pct:p})});
  });
  low.sort(function(a,b){return a.pct-b.pct});
  return {rows:rows,cnt:cnt,activeRows:activeRows,tot:tot,used:used,secArr:secArr,itemArr:itemArr,totalOF:totalOF,low:low,
    nOF:ofs.filter(isActiveOF).length};
}

/* ---------- contratos ---------- */
function filteredContracts(){
  var ref=S.ref,q=S.cSearch.trim().toLowerCase();
  return contracts.filter(function(c){
    var st=contractStatus(c,ref);
    var f=S.cFilter;
    if(f==='ativos'&&['vigente','v60','v30'].indexOf(st.key)<0)return false;
    if(f==='avencer'&&['v60','v30'].indexOf(st.key)<0)return false;
    if(f==='encerrados'&&st.key!=='vencido')return false;
    if(f==='futuros'&&st.key!=='futuro')return false;
    if(q&&(c.num+' '+c.forn+' '+c.obj).toLowerCase().indexOf(q)<0)return false;
    return true;
  });
}
function contractsTable(){
  var list=filteredContracts();

    var st=contractStatus(c,S.ref),tot=contractTotal(c),used=contractUsed(c),p=pctOf(used,tot),nOF=ofs.filter(function(o){return o.contractId===c.id}).length;

function updateOfForm(){
  var f=S.form,c=getC(f.contractId);
  var ban=document.getElementById('of-banner'),btn=document.getElementById('of-submit');
  if(!ban||!btn)return;
  var blocked=false,hb='';
  if(c){
    var st=contractStatus(c,S.ref);
    blocked=isBlocked(st);
    if(blocked&&f.editId)hb='<div class="note warn"><b>Contrato fora de vigência.</b> '+esc(blockReason(c,st))+' Só os dados do cabeçalho podem ser alterados; as quantidades ficam travadas.</div>';
    else if(blocked)hb='<div class="note bad"><b>Emissão bloqueada.</b> '+esc(blockReason(c,st))+'</div>';
    else if(st.key==='v30'||st.key==='v60')hb='<div class="note warn">Atenção: este contrato '+esc(st.label.toLowerCase())+' (término em '+fmtDate(c.end)+'). A OF só pode ser emitida até essa data.</div>';
    else hb='<div class="note ok">Contrato vigente até '+fmtDate(c.end)+'.</div>';
  }
  if(S.formMsg){
    hb+='<div class="note bad" style="margin-top:8px"><b>'+esc(S.formMsg.title)+'</b><ul>'+S.formMsg.list.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>';
  }
  ban.innerHTML=hb;
  btn.disabled=!c||(blocked&&!f.editId);
  if(!c)return;
  var total=0;
  c.items.forEach(function(it){
    var inp=document.getElementById('q-'+it.id);if(!inp)return;
    var msg=document.querySelector('[data-msg="'+it.id+'"]'),sub=document.querySelector('[data-sub="'+it.id+'"]');
    var raw=String(inp.value).trim(),s=saldoQty(c,it,f.editId),q=0,bad=false,text='',cls='rowmsg';
    inp.disabled=blocked||(s===0&&raw==='');
    if(raw!==''){
      if(!/^\d+$/.test(raw)){bad=true;text='Informe um número inteiro.'}
      else{q=parseInt(raw,10);if(q>s){bad=true;text='Excede o saldo. Máximo: '+NUM.format(s)+' '+it.un}}
    }
    inp.classList.toggle('err',bad);
    msg.textContent=text;msg.className=cls;
    if(!bad&&q>0){total+=q*it.price;sub.textContent=money(q*it.price)}else sub.textContent='—';
  });
  document.getElementById('of-total').textContent=money(total);
}

  });
}

function copyText(text,okMsg){
  function fallback(){
    var ok=false;
    try{var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();ok=document.execCommand('copy');ta.remove()}catch(e){ok=false}
    if(ok)toast(okMsg);else{S.modal={type:'text',text:text};render();var b=document.getElementById('copybox');if(b){b.focus();b.select()}}
  }
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast(okMsg)},fallback)}
    else fallback();
  }catch(e){fallback()}
}

/* ---------- erros e utilidades de gravação ---------- */
function errMsg(e){
  var m=(e&&(e.message||e.error_description||e.msg))||String(e||'Erro desconhecido'),c=e&&e.code,d=((e&&e.details)||'')+' '+m;
  if(/failed to fetch|networkerror|load failed|network request failed|fetch failed/i.test(m))return 'Sem conexão com o Supabase. Confira a URL do projeto, a chave e a sua internet. (Se esta página estiver aberta dentro do claude.ai, conexões externas são bloqueadas: abra o arquivo HTML salvo no navegador.)';
  if(/jwt/i.test(m)&&/expired|invalid/i.test(m))return 'Sua sessão expirou. Saia e entre novamente.';
  if(c==='23505'){
    if(/contratos_numero_uq/.test(d))return 'Já existe um contrato com esse número.';
    if(/itens_contrato_uq/.test(d))return 'Já existe um item com essa descrição e unidade neste contrato.';
    if(/itens_of_uq/.test(d))return 'Este item já consta nesta OF.';
    return 'Já existe um registro com esses dados.';
  }
  if(c==='23503')return 'Não é possível concluir: o registro está em uso (por exemplo, um item que já consta em uma OF).';
  if(c==='23514'){
    if(/cnpj/i.test(d))return 'CNPJ inválido. Use o formato 00.000.000/0000-00.';
    if(/vigencia/i.test(d))return 'A data de término não pode ser anterior ao início.';
    return 'Algum campo tem um valor inválido.';
  }
  if(c==='42501'||/row-level security|permission denied/i.test(m))return 'Você não tem permissão para esta operação.';
  return m;
}
function isAuthErr(e){var m=(e&&e.message)||'';return !!e&&(e.status===401||(/jwt/i.test(m)&&/expired|invalid/i.test(m)))}
function authMsg(e){
  var m=(e&&e.message)||'';
  if(/invalid login credentials/i.test(m))return 'E-mail ou senha incorretos.';
  if(/email not confirmed/i.test(m))return 'E-mail ainda não confirmado. Use o link enviado ao seu e-mail.';
  if(/invalid api key|apikey/i.test(m))return 'O projeto recusou a chave. Confira a Publishable key em "Configurar conexão".';
  return errMsg(e);
}
function mustAffect(r){if(!r.data||!r.data.length)throw {message:'Nenhum registro foi alterado. Você pode não ter permissão ou o registro foi removido por outra pessoa.'}}
function setBusy(b){var el=document.getElementById('busybar');if(el)el.hidden=!b}
async function guard(fn,onErr){
  if(S.busy)return;
  S.busy=true;setBusy(true);
  try{await fn()}
  catch(e){
    if(onErr)onErr(errMsg(e),e);else toast(errMsg(e));
    if(isAuthErr(e))setTimeout(logout,2500);
  }
  finally{S.busy=false;setBusy(false)}
}

function saveContract(){
  var m=S.modal,ec=m.editId?getC(m.editId):null;
  var g=function(id){return document.getElementById(id).value.trim()};
  var errs=[],num=g('n-num'),forn=g('n-forn'),obj=g('n-obj'),ini=g('n-ini'),fim=g('n-fim'),cnpj=g('n-cnpj');
  if(!num)errs.push('Informe o número do contrato.');
  else if(contracts.some(function(c){return c!==ec&&c.num.toLowerCase()===num.toLowerCase()}))errs.push('Já existe um contrato com o número '+num+'.');
  if(!forn)errs.push('Informe o fornecedor.');
  if(!obj)errs.push('Informe o objeto do contrato.');
  if(!ini||!fim)errs.push('Informe as datas de início e término.');
  else if(fim<ini)errs.push('A data de término não pode ser anterior ao início.');
  var items=[];
  if(!ec){
    document.querySelectorAll('#n-items tr').forEach(function(tr,i){
      var d=tr.querySelector('[data-f="desc"]').value.trim(),u=tr.querySelector('[data-f="un"]').value.trim()||'un',q=tr.querySelector('[data-f="qty"]').value.trim(),p=tr.querySelector('[data-f="price"]').value.trim();
      if(!d&&!q&&!p)return;
      var qn=Number(q),pn=Number(p);
      if(!d)errs.push('Item '+(i+1)+': informe a descrição.');
      else if(!/^\d+$/.test(q)||qn<1)errs.push('Item "'+d+'": a quantidade deve ser um inteiro maior que zero.');
      else if(p===''||isNaN(pn)||pn<0)errs.push('Item "'+d+'": informe o valor unitário.');
      else items.push({desc:d,un:u,qty:qn,price:pn});
    });
    if(!items.length&&!errs.length)errs.push('Cadastre pelo menos um item licitado.');
  }
  if(errs.length){document.getElementById('cf-errs').innerHTML='<div class="note bad" style="margin-bottom:12px"><b>Revise os campos</b><ul>'+errs.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>';return}
  var head={numero:num,fornecedor:forn,cnpj:cnpj||null,objeto:obj,data_inicio:ini,data_fim:fim};
  return guard(async function(){
    if(ec){
      var u=await sb.from('contratos').update(head).eq('id',ec.id).select('id');
      if(u.error)throw u.error;
      mustAffect(u);
      await loadAll();S.modal={type:'contract',id:ec.id};render();toast('Contrato '+num+' atualizado.');
      return;
    }
    var ins=await sb.from('contratos').insert(head).select('id').single();
    if(ins.error)throw ins.error;
    var cid=ins.data.id;
    var ri=await sb.from('itens_contrato').insert(items.map(function(i){return {contrato_id:cid,descricao:i.desc,unidade:i.un,quantidade_licitada:i.qty,valor_unitario:i.price}}));
    if(ri.error){await sb.from('contratos').delete().eq('id',cid);throw ri.error}
    await loadAll();S.modal={type:'contract',id:cid};S.tab='contratos';render();toast('Contrato '+num+' cadastrado.');
  },function(msg){showIn('cf-errs',msg)});
}
function saveItem(){
  var m=S.modal,c=getC(m.id),g=function(id){return document.getElementById(id).value.trim()};
  var it=m.item==='new'?null:c.items.filter(function(x){return x.id===m.item})[0];
  var d=g('i-desc'),u=g('i-un')||'un',q=g('i-qty'),p=g('i-price'),errs=[];

  if(!/^\d+$/.test(q)||Number(q)<1)errs.push('A quantidade deve ser um inteiro maior que zero.');
  else if(it&&Number(q)<usedQty(c,it.id))errs.push('A quantidade não pode ser menor que a já consumida em OFs ('+NUM.format(usedQty(c,it.id))+').');
  if(p===''||isNaN(Number(p))||Number(p)<0)errs.push('Informe o valor unitário.');

  var row={descricao:d,unidade:u,quantidade_licitada:Number(q),valor_unitario:Number(p)};

async function createOFdb(v){
  var f=S.form;
  var ins=await sb.from('ordens_fornecimento').insert({contrato_id:v.c.id,secretaria_id:v.secId,subdivisao:String(f.sub||'').trim()||null,solicitante:String(f.solicitante).trim(),justificativa:String(f.just||'').trim()||null}).select('id,numero').single();
  if(ins.error)throw ins.error;
  var ri=await sb.from('itens_of').insert(v.lines.map(function(l){return {of_id:ins.data.id,item_contrato_id:l.itemId,quantidade:l.qty}}));
  if(ri.error){await sb.from('ordens_fornecimento').delete().eq('id',ins.data.id);throw ri.error}
  return {id:ins.data.id,num:ins.data.numero};
}
async function updateOFdb(v){
  var f=S.form,ed=v.ed;
  var up=await sb.from('ordens_fornecimento').update({secretaria_id:v.secId,subdivisao:String(f.sub||'').trim()||null,solicitante:String(f.solicitante).trim(),justificativa:String(f.just||'').trim()||null}).eq('id',ed.id).select('id');
  if(up.error)throw up.error;
  mustAffect(up);
  var oldBy={},newBy={};
  ed.lines.forEach(function(l){oldBy[l.itemId]=l});
  v.lines.forEach(function(l){newBy[l.itemId]=l});
  /* 1) remove o que saiu, 2) ajusta quantidades (as reduções primeiro), 3) inclui o que entrou */
  var del=ed.lines.filter(function(l){return !newBy[l.itemId]});
  for(var i=0;i<del.length;i++){var rd=await sb.from('itens_of').delete().eq('id',del[i].id).select('id');if(rd.error)throw rd.error}
  var chg=v.lines.filter(function(l){return oldBy[l.itemId]&&oldBy[l.itemId].qty!==l.qty}).sort(function(a,b){return (a.qty-oldBy[a.itemId].qty)-(b.qty-oldBy[b.itemId].qty)});
  for(var j=0;j<chg.length;j++){var ru=await sb.from('itens_of').update({quantidade:chg[j].qty}).eq('id',oldBy[chg[j].itemId].id).select('id');if(ru.error)throw ru.error;mustAffect(ru)}
  var add=v.lines.filter(function(l){return !oldBy[l.itemId]});
  if(add.length){var ra=await sb.from('itens_of').insert(add.map(function(l){return {of_id:ed.id,item_contrato_id:l.itemId,quantidade:l.qty}}));if(ra.error)throw ra.error}
  return {id:ed.id,num:ed.num};
}
function submitOF(){
  var f=S.form,v=validateOF(f);
  if(v.errs){S.formMsg={title:'Não foi possível salvar a OF',list:v.errs};updateOfForm();var bn=document.getElementById('of-banner');if(bn)bn.scrollIntoView({block:'center'});return}
  return guard(async function(){
    var res=v.ed?await updateOFdb(v):await createOFdb(v);
    await loadAll();
    var keep=f.solicitante;
    S.formMsg=null;S.form=blankForm();S.form.solicitante=keep;S.tab='ofs';S.modal={type:'of',id:res.id};render();
    toast('OF '+res.num+(v.ed?' atualizada.':' emitida.'));
  },function(msg){
    S.formMsg={title:'O banco recusou a gravação',list:[msg]};updateOfForm();
    loadAll().then(function(){if(S.tab==='nova')updateOfForm()}).catch(function(){});
  });
}

  try{Object.keys(window.localStorage).filter(function(k){return /^sb-.*-auth-token/.test(k)}).forEach(function(k){window.localStorage.removeItem(k)})}catch(e){}
  contracts=[];ofs=[];secretarias=[];SECS=[];
  S.user=null;S.profile=null;S.status='login';S.modal=null;S.askCancel=null;S.askDel=null;S.askDelC=null;S.tab='painel';S.loginErr='';S.form=blankForm();
  render();
}
async function testConn(url,key){
  var ctl=new AbortController(),t=setTimeout(function(){ctl.abort()},10000);
  try{
    var r=await fetch(url.replace(/\/+$/,'')+'/auth/v1/settings',{headers:{apikey:key},signal:ctl.signal});
    if(r.ok)return {ok:true,msg:'Conexão OK: projeto encontrado e chave aceita.'};
    if(r.status===401||r.status===403)return {ok:false,msg:'O projeto respondeu, mas recusou a chave (erro '+r.status+'). Confira se copiou a Publishable key inteira.'};
    return {ok:false,msg:'O servidor respondeu com o erro '+r.status+'. Confira a URL do projeto.'};
  }catch(e){return {ok:false,msg:errMsg({message:(e&&e.name==='AbortError')?'Failed to fetch':((e&&e.message)||String(e))})}}
  finally{clearTimeout(t)}
}
async function cfgSave(){
  var url=document.getElementById('c-url').value.trim(),key=document.getElementById('c-key').value.trim(),em=document.getElementById('l-email').value;
  var p=cfgProblems({url:url,key:key});
  if(p.length){S.cfgMsg={ok:false,msg:p.join(' ')};renderLogin(em);return}
  try{window.localStorage.setItem(CFG_KEY,JSON.stringify({url:url,key:key}))}catch(e){}
  var pr=makeClient();
  if(pr.length){S.cfgMsg={ok:false,msg:pr.join(' ')};renderLogin(em);return}
  S.cfgMsg={ok:true,msg:'Testando conexão…'};renderLogin(em);
  S.cfgMsg=await testConn(url,key);
  if(S.cfgMsg.ok)S.loginErr='';
  renderLogin(em);
}
function cfgReset(){
  var em=document.getElementById('l-email').value;
  try{window.localStorage.removeItem(CFG_KEY)}catch(e){}
  S.cfgMsg=null;sb=null;makeClient();renderLogin(em);
}
async function boot(){
  var probs=makeClient();
  if(probs.length){S.status='login';S.cfgOpen=true;S.loginErr=probs.join(' ');render();return}
  try{
    var r=await sb.auth.getSession();
    if(r&&r.data&&r.data.session){await enterApp(r.data.session.user);return}
  }catch(e){}
  S.status='login';render();
}

render();
boot();
})();
</script>
